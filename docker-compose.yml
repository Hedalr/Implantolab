services:
  postgres:
    image: postgres:16-alpine
    container_name: implantolab-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: implantolab
      POSTGRES_PASSWORD: implantolab
      POSTGRES_DB: implantolab
    volumes:
      - implantolab_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U implantolab -d implantolab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  implantolab_pg_data:
